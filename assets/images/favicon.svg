<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hpFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="hpMetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c5d4e8" />
      <stop offset="100%" stop-color="#7a8d9e" />
    </linearGradient>
    <filter id="hpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container with Cyber Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#080c14" stroke="url(#hpFavGrad)" stroke-width="2.5" />

  <!-- Headphone Main Band (Arch) -->
  <path d="M17 33 C17 17, 47 17, 47 33" stroke="url(#hpFavGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#hpGlow)" />
  <!-- Inner Cushion Arc -->
  <path d="M22 28 C22 20, 42 20, 42 28" stroke="url(#hpMetalGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />

  <!-- Left Fork / Hinge -->
  <path d="M17 31 L17 36" stroke="url(#hpMetalGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Left Earcup Cushion (Angled/Rounded) -->
  <rect x="11" y="32" width="10" height="19" rx="4.5" fill="url(#hpFavGrad)" />
  <rect x="13" y="34" width="6" height="15" rx="2.5" fill="#080c14" opacity="0.6" />

  <!-- Right Fork / Hinge -->
  <path d="M47 31 L47 36" stroke="url(#hpMetalGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Right Earcup Cushion (Angled/Rounded) -->
  <rect x="43" y="32" width="10" height="19" rx="4.5" fill="url(#hpFavGrad)" />
  <rect x="45" y="34" width="6" height="15" rx="2.5" fill="#080c14" opacity="0.6" />

  <!-- Center Soundwave Equalizer Bars (Audio Gear Accent) -->
  <rect x="27" y="39" width="2" height="7" rx="1" fill="#00f3ff" opacity="0.85" />
  <rect x="31" y="35" width="2" height="12" rx="1" fill="#ff007f" />
  <rect x="35" y="38" width="2" height="8" rx="1" fill="#00f3ff" opacity="0.85" />
</svg>
