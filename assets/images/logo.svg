<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52" fill="none">
  <defs>
    <linearGradient id="cyberGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="metalGradLogo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8ba1be" />
    </linearGradient>
    <filter id="neonGlowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Emblem Container (48x48) featuring the Studio Headphone Icon -->
  <g transform="translate(4, 3)">
    <!-- Base Badge -->
    <rect x="1" y="1" width="44" height="44" rx="12" fill="#090d16" stroke="url(#cyberGradLogo)" stroke-width="2" />
    
    <!-- Headphone Arch -->
    <path d="M12 24 C12 12, 34 12, 34 24" stroke="url(#cyberGradLogo)" stroke-width="3.2" stroke-linecap="round" filter="url(#neonGlowLogo)" />
    <!-- Inner Band Accent -->
    <path d="M16 20 C16 15, 30 15, 30 20" stroke="url(#metalGradLogo)" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />
    
    <!-- Left Earcup -->
    <rect x="7" y="23" width="7.5" height="14" rx="3" fill="url(#cyberGradLogo)" />
    <rect x="8.5" y="24.5" width="4.5" height="11" rx="1.5" fill="#090d16" opacity="0.6" />

    <!-- Right Earcup -->
    <rect x="31.5" y="23" width="7.5" height="14" rx="3" fill="url(#cyberGradLogo)" />
    <rect x="33" y="24.5" width="4.5" height="11" rx="1.5" fill="#090d16" opacity="0.6" />

    <!-- Center Equalizer Soundwave Accent -->
    <rect x="19" y="28" width="1.8" height="5" rx="0.9" fill="#00f3ff" opacity="0.8" />
    <rect x="22" y="25" width="1.8" height="9" rx="0.9" fill="#ff007f" />
    <rect x="25" y="27" width="1.8" height="6" rx="0.9" fill="#00f3ff" opacity="0.8" />
  </g>

  <!-- Brand Typography -->
  <text x="60" y="27" font-family="'Orbitron', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="2" fill="#ffffff">
    NEXUS<tspan fill="url(#cyberGradLogo)">VR</tspan>
  </text>
  <text x="61" y="42" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.4" fill="#9bb0cc">
    IMMERSIVE ARCADE &amp; AUDIO LABS
  </text>
</svg>
